<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>.reports — Index</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_assets/theme.css">
<link rel="stylesheet" href="_assets/components.css">
<style>
  .toolbar {
    display: flex;
    gap: var(--sp-3);
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: var(--sp-4);
  }
  .toolbar input[type="search"] {
    flex: 1 1 280px;
    min-width: 240px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--radius-sm);
    font-size: var(--fz-base);
    font-family: var(--font-sans);
  }
  .toolbar input[type="search"]::placeholder { color: var(--text-mute); }
  .toolbar input[type="search"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .filters {
    display: flex;
    gap: var(--sp-1);
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: var(--sp-1) var(--sp-3);
    border-radius: var(--radius-sm);
    font-size: var(--fz-sm);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .filter-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .filter-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  .secondary-filters {
    display: none;
    gap: var(--sp-1);
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: var(--sp-4);
    padding: var(--sp-2) var(--sp-3);
    background: var(--bg-elev);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
  }
  .secondary-filters.show { display: flex; }
  .secondary-filters .label {
    font-size: var(--fz-xs);
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: var(--sp-2);
  }
  .secondary-filters .pill-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: var(--fz-xs);
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-mono);
  }
  .secondary-filters .pill-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .secondary-filters .pill-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  .report-list { display: flex; flex-direction: column; gap: var(--sp-3); }

  .report-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: var(--sp-4) var(--sp-5);
    display: grid;
    grid-template-columns: 100px 1fr auto;
    gap: var(--sp-4);
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, border-color 0.15s;
  }
  .report-card:hover {
    transform: translateY(-1px);
    border-left-color: var(--accent-warm);
    text-decoration: none;
  }

  .report-card.type-decision      { border-left-color: var(--type-decision); }
  .report-card.type-plan          { border-left-color: var(--type-plan); }
  .report-card.type-brief         { border-left-color: var(--type-brief); }
  .report-card.type-review        { border-left-color: var(--type-review); }
  .report-card.type-retrospective { border-left-color: var(--type-retrospective); }
  .report-card.type-architecture  { border-left-color: var(--type-architecture); }
  /* 後方互換 */
  .report-card.type-audit         { border-left-color: var(--type-brief); }
  .report-card.type-adr-analysis  { border-left-color: var(--type-decision); }

  .report-date {
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: var(--fz-sm);
    text-align: left;
    padding-top: 2px;
  }
  .report-date .updated {
    display: block;
    color: var(--text-mute);
    font-size: var(--fz-xs);
    margin-top: 2px;
  }

  .report-main { min-width: 0; }
  .report-title {
    margin: 0 0 var(--sp-1);
    font-size: var(--fz-md);
    font-weight: 600;
    color: var(--text);
  }
  .report-one-line {
    color: var(--text-dim);
    font-size: var(--fz-sm);
    margin: 0 0 var(--sp-2);
  }
  .report-key-terms {
    display: flex;
    gap: var(--sp-1);
    flex-wrap: wrap;
    margin: 0 0 var(--sp-2);
  }
  .key-term {
    background: rgba(88, 166, 255, 0.08);
    color: var(--accent);
    padding: 1px 8px;
    border-radius: var(--radius-sm);
    font-size: var(--fz-xs);
    font-family: var(--font-mono);
  }
  .report-tags { display: flex; gap: var(--sp-1); flex-wrap: wrap; }

  .report-meta {
    text-align: right;
    color: var(--text-mute);
    font-size: var(--fz-xs);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .report-type {
    display: inline-block;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .report-type.decision      { background: rgba(163,113,247,.15); color: var(--type-decision); }
  .report-type.plan          { background: rgba(63,185,80,.15);   color: var(--type-plan); }
  .report-type.brief         { background: rgba(240,136,62,.15);  color: var(--type-brief); }
  .report-type.review        { background: rgba(88,166,255,.15);  color: var(--type-review); }
  .report-type.retrospective { background: rgba(236,108,185,.15); color: var(--type-retrospective); }
  .report-type.architecture  { background: rgba(91,211,199,.15);  color: var(--type-architecture); }
  /* 後方互換 */
  .report-type.audit         { background: rgba(240,136,62,.15);  color: var(--type-brief); }
  .report-type.adr-analysis  { background: rgba(163,113,247,.15); color: var(--type-decision); }

  .report-attr {
    font-family: var(--font-mono);
    font-size: var(--fz-xs);
    color: var(--text-dim);
  }
  .report-reading {
    font-family: var(--font-mono);
    font-size: var(--fz-xs);
    color: var(--text-mute);
  }
  .report-author { display: block; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: var(--sp-3);
    margin-bottom: var(--sp-6);
  }
  .stat {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--sp-3) var(--sp-4);
  }
  .stat-label {
    color: var(--text-dim);
    font-size: var(--fz-xs);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-value {
    font-size: var(--fz-xl);
    font-weight: 700;
    font-family: var(--font-mono);
    color: var(--text);
  }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: var(--sp-12);
    background: var(--bg-elev);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  @media (max-width: 720px) {
    .report-card {
      grid-template-columns: 1fr;
    }
    .report-meta { text-align: left; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container container-wide">

<header class="report-header">
  <h1>.reports / Index</h1>
  <div class="meta">
    <span>判断・計画・引き継ぎ・指摘・振り返りのカタログ (5 種)</span>
  </div>
</header>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <input type="search" id="q" placeholder="タイトル / 1 行サマリ / key_terms / タグで検索...">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-type="">All</button>
    <button class="filter-btn" data-type="decision">Decision</button>
    <button class="filter-btn" data-type="plan">Plan</button>
    <button class="filter-btn" data-type="brief">Brief</button>
    <button class="filter-btn" data-type="review">Review</button>
    <button class="filter-btn" data-type="retrospective">Retro</button>
    <button class="filter-btn" data-type="architecture">Arch</button>
  </div>
</div>

<div class="secondary-filters" id="secondary-filters">
  <span class="label" id="secondary-label">属性</span>
  <span id="secondary-buttons"></span>
</div>

<div class="report-list" id="list"></div>

<footer class="report-footer">
  新規レポート: <code>mise run report:new -- &lt;type&gt; &lt;slug&gt; [--&lt;attr&gt; &lt;val&gt;]</code>
  / 旧 4 種から移行: <code>mise run report:migrate</code>
</footer>

</div>

<script src="_index.js"></script>
<script src="_assets/reports.js"></script>
<script>
(function () {
  "use strict";

  const list = document.getElementById("list");
  const q = document.getElementById("q");
  const filters = document.getElementById("filters");
  const statsEl = document.getElementById("stats");
  const secondaryEl = document.getElementById("secondary-filters");
  const secondaryBtns = document.getElementById("secondary-buttons");
  const secondaryLabel = document.getElementById("secondary-label");

  // 種別ごとの属性定義
  const ATTR_BY_TYPE = {
    decision:      { name: "weight", values: ["light", "heavy"] },
    brief:         { name: "target", values: ["issue", "pr", "handoff"] },
    review:        { name: "scope",  values: ["pr", "module", "periodic"] },
    retrospective: { name: "base",   values: ["plan", "incident"] },
    architecture: { name: "detail", values: ["overview", "module", "class"] },
  };

  let activeType = "";
  let activeQuery = "";
  let activeAttr = "";  // selected attribute value (weight/target/scope/base)

  function renderStats(entries) {
    const counts = entries.reduce((acc, e) => {
      acc.total++;
      acc[e.type] = (acc[e.type] || 0) + 1;
      return acc;
    }, { total: 0 });

    statsEl.innerHTML = `
      <div class="stat"><div class="stat-label">Total</div><div class="stat-value">${counts.total}</div></div>
      <div class="stat"><div class="stat-label">Decision</div><div class="stat-value">${counts.decision || 0}</div></div>
      <div class="stat"><div class="stat-label">Plan</div><div class="stat-value">${counts.plan || 0}</div></div>
      <div class="stat"><div class="stat-label">Brief</div><div class="stat-value">${counts.brief || 0}</div></div>
      <div class="stat"><div class="stat-label">Review</div><div class="stat-value">${counts.review || 0}</div></div>
      <div class="stat"><div class="stat-label">Retrospective</div><div class="stat-value">${counts.retrospective || 0}</div></div>
      <div class="stat"><div class="stat-label">Architecture</div><div class="stat-value">${counts.architecture || 0}</div></div>
    `;
  }

  function renderSecondaryFilters() {
    const def = ATTR_BY_TYPE[activeType];
    if (!def) {
      secondaryEl.classList.remove("show");
      activeAttr = "";
      return;
    }
    secondaryEl.classList.add("show");
    secondaryLabel.textContent = `${def.name}:`;
    secondaryBtns.innerHTML = [
      `<button class="pill-btn ${activeAttr === "" ? "active" : ""}" data-attr="">All</button>`,
      ...def.values.map(v =>
        `<button class="pill-btn ${activeAttr === v ? "active" : ""}" data-attr="${v}">${v}</button>`
      )
    ].join("");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function getEntryAttr(entry) {
    const def = ATTR_BY_TYPE[entry.type];
    if (!def) return null;
    return entry[def.name] || null;
  }

  function matches(entry) {
    if (activeType && entry.type !== activeType) return false;
    if (activeAttr) {
      const v = getEntryAttr(entry);
      if (v !== activeAttr) return false;
    }
    if (!activeQuery) return true;
    const scent = entry.scent || {};
    const hay = [
      entry.title, entry.id,
      entry.summary || "",
      scent.one_line || "",
      ...(scent.key_terms || []),
      ...(entry.tags || []),
      entry.author || "",
    ].join(" ").toLowerCase();
    return hay.includes(activeQuery.toLowerCase());
  }

  function formatAttrBadge(entry) {
    const v = getEntryAttr(entry);
    if (!v) return "";
    const def = ATTR_BY_TYPE[entry.type];
    return `<span class="report-attr">${escapeHtml(def.name)}: ${escapeHtml(v)}</span>`;
  }

  function render() {
    const all = (window.REPORTS_INDEX || []).slice();
    all.sort((a, b) => {
      if ((a.status === "template") !== (b.status === "template")) {
        return a.status === "template" ? 1 : -1;
      }
      const da = a.updated || a.date || "";
      const db = b.updated || b.date || "";
      return db.localeCompare(da);
    });

    renderStats(all.filter((e) => e.status !== "template"));

    const filtered = all.filter(matches);
    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty">該当するレポートがありません。</div>`;
      return;
    }

    list.innerHTML = filtered.map((e) => {
      const scent = e.scent || {};
      const oneLine = scent.one_line || e.summary || "";
      const tags = (e.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      const keyTerms = (scent.key_terms || []).slice(0, 4).map((k) =>
        `<span class="key-term">${escapeHtml(k)}</span>`
      ).join("");
      const statusBadge = e.status && e.status !== "done"
        ? `<span class="badge badge-${e.status === "draft" ? "warn" : e.status === "in-progress" ? "info" : "mute"}">${escapeHtml(e.status)}</span>`
        : "";
      const reading = scent.reading_minutes
        ? `<span class="report-reading">~${scent.reading_minutes}min</span>`
        : "";
      const updated = e.updated && e.updated !== e.date
        ? `<span class="updated">updated: ${escapeHtml(e.updated)}</span>`
        : "";

      return `
        <a class="report-card type-${e.type}" href="${escapeHtml(e.path)}">
          <div class="report-date">
            ${escapeHtml(e.date || "—")}
            ${updated}
          </div>
          <div class="report-main">
            <h3 class="report-title">${escapeHtml(e.title)} ${statusBadge}</h3>
            ${oneLine ? `<p class="report-one-line">${escapeHtml(oneLine)}</p>` : ""}
            ${keyTerms ? `<div class="report-key-terms">${keyTerms}</div>` : ""}
            <div class="report-tags">${tags}</div>
          </div>
          <div class="report-meta">
            <span class="report-type ${e.type}">${escapeHtml(e.type)}</span>
            ${formatAttrBadge(e)}
            ${reading}
            ${e.author ? `<span class="report-author">${escapeHtml(e.author)}</span>` : ""}
          </div>
        </a>
      `;
    }).join("");
  }

  // Wire events
  q.addEventListener("input", (e) => { activeQuery = e.target.value; render(); });
  filters.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    filters.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    activeType = btn.dataset.type;
    activeAttr = "";
    renderSecondaryFilters();
    render();
  });
  secondaryBtns.addEventListener("click", (e) => {
    const btn = e.target.closest(".pill-btn");
    if (!btn) return;
    secondaryBtns.querySelectorAll(".pill-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    activeAttr = btn.dataset.attr;
    render();
  });

  renderSecondaryFilters();
  render();
})();
</script>
</body>
</html>
