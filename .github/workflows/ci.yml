name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dotnet-version: 8.0.x
            framework: net8.0
          - os: ubuntu-latest
            dotnet-version: 10.0.x
            framework: net10.0
          - os: windows-latest
            dotnet-version: 10.0.x
            framework: net10.0

    steps:
      # MinVer needs full history + tags; shallow clones yield 0.0.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore tests/Unilyze.Tests/Unilyze.Tests.csproj

      - name: Test
        run: dotnet test tests/Unilyze.Tests/Unilyze.Tests.csproj -f ${{ matrix.framework }} --no-restore -v minimal

  # Self quality gate (issue #29): dogfood badge --fail-under on this repo.
  # Measured 2026-06-10 (SyntaxOnly, -p src/Unilyze, same scope as badges.yml): avg CodeHealth 9.7, min 8.0.
  # --fail-under 8.0 = floor(min); gates on min CodeHealth (inclusive at boundary).
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      # MinVer needs full history + tags; shallow clones yield 0.0.0.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Unilyze/Unilyze.csproj

      - name: Build
        run: dotnet build src/Unilyze/Unilyze.csproj -c Release --no-restore

      # --framework is required because Unilyze.csproj is multi-targeted (net8.0;net10.0).
      # Path and Release/net10.0 match .github/workflows/badges.yml; runtime references enable Complete analysis.
      - name: CodeHealth gate
        run: |
          dotnet run --project src/Unilyze -c Release --framework net10.0 --no-build -- \
            badge -p src/Unilyze --metric codehealth --fail-under 8.0

  code-scanning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Unilyze/Unilyze.csproj

      - name: Build
        run: dotnet build src/Unilyze/Unilyze.csproj -c Release --no-restore

      - name: Generate SARIF
        run: |
          dotnet run --project src/Unilyze -c Release --framework net10.0 --no-build -- \
            -p src/Unilyze -f sarif -o unilyze.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: unilyze.sarif
          category: unilyze

  pack-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Unilyze/Unilyze.csproj

      - name: Pack
        run: dotnet pack src/Unilyze/Unilyze.csproj -c Release --no-restore -o ./artifacts/nupkg

      - name: Read package version
        id: package
        shell: bash
        run: |
          nupkg=$(find ./artifacts/nupkg -maxdepth 1 -name 'Unilyze.*.nupkg' -print -quit)
          version=$(basename "$nupkg" .nupkg | sed 's/^Unilyze\.//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release smoke
        run: bash ./scripts/release-smoke.sh --package-source ./artifacts/nupkg --version "${{ steps.package.outputs.version }}"
