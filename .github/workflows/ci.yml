name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Belt-and-suspenders: caps the entire job at 20m so a deadlocked process
    # that bypasses blame-hang still fails fast instead of consuming 6h.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dotnet-version: 8.0.x
            framework: net8.0
          - os: ubuntu-latest
            dotnet-version: 9.0.x
            framework: net9.0
          - os: ubuntu-latest
            dotnet-version: 10.0.x
            framework: net10.0
          - os: windows-latest
            dotnet-version: 10.0.x
            framework: net10.0

    steps:
      # MinVer needs full history + tags; shallow clones yield 0.0.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore tests/Unilyze.Tests/Unilyze.Tests.csproj

      # Hang-blame aborts a hung run after 15m and prints the tests that were still running.
      - name: Test
        run: dotnet test tests/Unilyze.Tests/Unilyze.Tests.csproj -f ${{ matrix.framework }} --no-restore -v minimal --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none

  # Self quality gate (issue #29): dogfood badge --fail-under on this repo.
  # Re-measured 2026-06-13 under CodeHealth v2 (#155, non-compensatory aggregation),
  # after merging main (#173 energy proxy): avg 9.8 / min 6.6 / LoC-weighted 9.3 / tail 8.3
  # at Complete level. --fail-under 6.6 = v2 min; gates on min CodeHealth (inclusive at boundary).
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      # MinVer needs full history + tags; shallow clones yield 0.0.0.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Unilyze/Unilyze.csproj

      - name: Build
        run: dotnet build src/Unilyze/Unilyze.csproj -c Release --no-restore

      # --framework is required because Unilyze.csproj is multi-targeted (net8.0;net9.0;net10.0).
      # Path and Release/net10.0 match .github/workflows/badges.yml; runtime references enable Complete analysis.
      - name: CodeHealth gate
        run: |
          dotnet run --project src/Unilyze -c Release --framework net10.0 --no-build -- \
            badge -p src/Unilyze --metric codehealth --fail-under 6.6

  code-scanning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Unilyze/Unilyze.csproj

      - name: Build
        run: dotnet build src/Unilyze/Unilyze.csproj -c Release --no-restore

      - name: Generate SARIF
        run: |
          dotnet run --project src/Unilyze -c Release --framework net10.0 --no-build -- \
            -p src/Unilyze -f sarif -o unilyze.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: unilyze.sarif
          category: unilyze

  pack-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Unilyze/Unilyze.csproj

      - name: Pack
        run: dotnet pack src/Unilyze/Unilyze.csproj -c Release --no-restore -o ./artifacts/nupkg

      - name: Read package version
        id: package
        shell: bash
        run: |
          nupkg=$(find ./artifacts/nupkg -maxdepth 1 -name 'Unilyze.*.nupkg' -print -quit)
          version=$(basename "$nupkg" .nupkg | sed 's/^Unilyze\.//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release smoke
        run: bash ./scripts/release-smoke.sh --package-source ./artifacts/nupkg --version "${{ steps.package.outputs.version }}"

  # Render the serve viewer in headless Chromium (Playwright): fail on any console/page
  # error or missing key element, and upload screenshots of each screen for visual review.
  # Smoke + artifacts (not pixel-diff), so it is stable across fonts/OS.
  viewer-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build CLI
        run: dotnet build src/Unilyze/Unilyze.csproj -c Release -f net10.0

      - name: Install Playwright + Chromium
        working-directory: scripts/viewer-screenshots
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Capture viewer screenshots (smoke gate)
        working-directory: scripts/viewer-screenshots
        env:
          UNILYZE_DLL: ${{ github.workspace }}/src/Unilyze/bin/Release/net10.0/Unilyze.dll
        run: node capture.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serve-viewer-screenshots
          path: scripts/viewer-screenshots/out/*.png
          if-no-files-found: warn
