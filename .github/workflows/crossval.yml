name: CycCC cross-validation

on:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  crossval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore src/Unilyze/Unilyze.csproj
          dotnet restore scripts/crossval/CrossVal.csproj

      - name: Build
        run: |
          dotnet build src/Unilyze/Unilyze.csproj -c Release --no-restore
          dotnet build scripts/crossval/CrossVal.csproj -c Release --no-restore

      - name: Self-analysis JSON
        run: |
          dotnet run --project src/Unilyze -c Release --framework net10.0 --no-build -- \
            -p src/Unilyze -f json > unilyze-cc.json

      - name: Official Roslyn metrics JSON
        run: |
          dotnet run --project scripts/crossval -c Release --no-build -- \
            src/Unilyze/Unilyze.csproj > official-cc.json

      - name: Compare CycCC residual identity
        run: |
          dotnet run --project scripts/crossval -c Release --no-build -- \
            compare official-cc.json unilyze-cc.json
