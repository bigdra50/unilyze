name: Badges

on:
  push:
    branches:
      - main
  workflow_dispatch:

# contents: write is required to force-push the generated JSON to the badges branch
permissions:
  contents: write

concurrency:
  group: badges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Unilyze/Unilyze.csproj

      # --framework is required because Unilyze.csproj is multi-targeted (net8.0;net9.0;net10.0)
      - name: Generate badge SVGs (self-analysis)
        run: |
          mkdir -p /tmp/badge-data
          for metric in codehealth mi smells; do
            dotnet run --project src/Unilyze -c Release --framework net10.0 -- \
              badge -p src/Unilyze --metric "$metric" --format svg -o "/tmp/badge-data/$metric.svg"
          done

      - name: Push to badges branch
        run: |
          cd /tmp/badge-data
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "update badges"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
