name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Unilyze/Unilyze.csproj

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install documentation dependencies
        run: pip install mkdocs-material

      - name: Build documentation site
        run: mkdocs build --strict -d _site

      # --framework is required because Unilyze.csproj is multi-targeted (net8.0;net10.0).
      # Self-analysis (dogfooding): unilyze analyzes its own source and emits the interactive HTML.
      - name: Generate demo HTML (self-analysis)
        run: |
          mkdir -p _site/demo
          dotnet run --project src/Unilyze -c Release --framework net10.0 --no-restore -- \
            -p src/Unilyze -o _site/demo/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
