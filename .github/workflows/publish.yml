name: Publish NuGet

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.package.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ensure API key is configured
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "Repository secret NUGET_API_KEY is not set." >&2
            exit 1
          fi

      - name: Restore tests
        run: dotnet restore tests/Unilyze.Tests/Unilyze.Tests.csproj

      - name: Test net10.0
        run: dotnet test tests/Unilyze.Tests/Unilyze.Tests.csproj -f net10.0 --no-restore -v minimal

      - name: Restore package project
        run: dotnet restore src/Unilyze/Unilyze.csproj

      - name: Pack
        run: dotnet pack src/Unilyze/Unilyze.csproj -c Release --no-restore -o ./artifacts/nupkg

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            nupkg=$(find ./artifacts/nupkg -maxdepth 1 -name 'Unilyze.*.nupkg' -print -quit)
            version=$(basename "$nupkg" .nupkg | sed 's/^Unilyze\.//')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release smoke
        run: bash ./scripts/release-smoke.sh --package-source ./artifacts/nupkg --version "${{ steps.package.outputs.version }}"

      - name: Push package to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./artifacts/nupkg/*.nupkg \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            /^## \[/ {found=0}
            found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version (Release Checklist step 8)"
            exit 1
          fi
          # Idempotent: re-runs (or a release created out of band) must not 422 on
          # "tag_name already exists". Create when missing, otherwise sync the notes.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi

  binaries:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - osx-arm64
          - osx-x64
          - linux-x64
          - win-x64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained binary
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish src/Unilyze/Unilyze.csproj \
            -c Release \
            -f net10.0 \
            -r "$RID" \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true \
            -o "./artifacts/publish/$RID"

      - name: Archive binary
        id: archive
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir -p ./artifacts/release
          if [[ "$RID" == "win-x64" ]]; then
            cp "./artifacts/publish/$RID/Unilyze.exe" ./artifacts/release/unilyze.exe
            archive="unilyze-$VERSION-$RID.zip"
            (cd ./artifacts/release && zip "$archive" unilyze.exe)
            rm ./artifacts/release/unilyze.exe
            binary="./artifacts/publish/$RID/Unilyze.exe"
          else
            cp "./artifacts/publish/$RID/Unilyze" ./artifacts/release/unilyze
            chmod +x ./artifacts/release/unilyze
            archive="unilyze-$VERSION-$RID.tar.gz"
            tar -C ./artifacts/release -czf "./artifacts/release/$archive" unilyze
            rm ./artifacts/release/unilyze
            binary="./artifacts/publish/$RID/Unilyze"
          fi

          binary_bytes=$(stat -c %s "$binary")
          archive_bytes=$(stat -c %s "./artifacts/release/$archive")
          {
            echo "### $RID binary"
            echo
            echo "| File | Bytes | Human-readable |"
            echo "| --- | ---: | ---: |"
            echo "| Binary | $binary_bytes | $(numfmt --to=iec-i --suffix=B "$binary_bytes") |"
            echo "| $archive | $archive_bytes | $(numfmt --to=iec-i --suffix=B "$archive_bytes") |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Smoke test Linux binary
        if: matrix.rid == 'linux-x64'
        env:
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          binary=./artifacts/publish/linux-x64/Unilyze
          actual_version=$("$binary" --version)
          if [[ "$actual_version" != "unilyze $EXPECTED_VERSION" ]]; then
            echo "::error::Expected 'unilyze $EXPECTED_VERSION', got '$actual_version'"
            exit 1
          fi

          "$binary" skills list
          "$binary" badge -p src/Unilyze --metric codehealth --fail-under 6.6
          "$binary" -p src/Unilyze -f json -o ./artifacts/self-contained.json
          dotnet run --project src/Unilyze -c Release -f net10.0 -- \
            -p src/Unilyze -f json -o ./artifacts/dotnet-hosted.json

          bundled_level=$(jq -r .analysisLevel ./artifacts/self-contained.json)
          hosted_level=$(jq -r .analysisLevel ./artifacts/dotnet-hosted.json)
          if [[ "$bundled_level" != "$hosted_level" ]]; then
            echo "::error::Single-file analysis level '$bundled_level' differs from hosted level '$hosted_level'"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: artifacts/release/${{ steps.archive.outputs.archive }}
          if-no-files-found: error

  release-assets:
    needs:
      - publish
      - binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts/release
          merge-multiple: true

      - name: Generate checksums and package manifests
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          cd artifacts/release
          sha256sum unilyze-"$VERSION"-*.tar.gz unilyze-"$VERSION"-*.zip | sort -k 2 > SHA256SUMS

          osx_arm64_sha=$(sha256sum "unilyze-$VERSION-osx-arm64.tar.gz" | cut -d ' ' -f 1)
          osx_x64_sha=$(sha256sum "unilyze-$VERSION-osx-x64.tar.gz" | cut -d ' ' -f 1)
          linux_x64_sha=$(sha256sum "unilyze-$VERSION-linux-x64.tar.gz" | cut -d ' ' -f 1)
          win_x64_sha=$(sha256sum "unilyze-$VERSION-win-x64.zip" | cut -d ' ' -f 1)

          sed \
            -e "s/__VERSION__/$VERSION/g" \
            -e "s/__OSX_ARM64_SHA256__/$osx_arm64_sha/g" \
            -e "s/__OSX_X64_SHA256__/$osx_x64_sha/g" \
            -e "s/__LINUX_X64_SHA256__/$linux_x64_sha/g" \
            "$GITHUB_WORKSPACE/packaging/unilyze.rb" > unilyze.rb
          sed \
            -e "s/__VERSION__/$VERSION/g" \
            -e "s/__WIN_X64_SHA256__/$win_x64_sha/g" \
            "$GITHUB_WORKSPACE/packaging/unilyze.json" > unilyze.json

          ruby -c unilyze.rb
          jq . unilyze.json >/dev/null
          if grep -Eq '__[A-Z0-9_]+__' unilyze.rb unilyze.json; then
            echo "::error::Unresolved packaging placeholder"
            exit 1
          fi

          {
            echo "### Release assets"
            echo
            echo '```text'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/release/unilyze-"${{ needs.publish.outputs.version }}"-*.tar.gz \
            artifacts/release/unilyze-"${{ needs.publish.outputs.version }}"-*.zip \
            artifacts/release/SHA256SUMS \
            artifacts/release/unilyze.rb \
            artifacts/release/unilyze.json \
            --clobber

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [[ -z "${HOMEBREW_TAP_DEPLOY_KEY}" ]]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY secret is not set; skipping Homebrew tap update."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "${HOMEBREW_TAP_DEPLOY_KEY}" > "$HOME/.ssh/tap_deploy_key"
          chmod 600 "$HOME/.ssh/tap_deploy_key"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git clone --depth 1 git@github.com:bigdra50/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp artifacts/release/unilyze.rb tap/Formula/unilyze.rb
          cd tap
          if git diff --quiet -- Formula/unilyze.rb; then
            echo "Formula already up to date for ${VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/unilyze.rb
          git commit -m "unilyze ${VERSION}"
          git push
